name: Release addon

on:
  push:
    tags: ['*/v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prospective addon tag to preview from main (no publication)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  build:
    name: Validate and package selected addon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || format('refs/tags/{0}', env.RELEASE_TAG) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r .github/ci/requirements.txt
      - run: python -m unittest discover -s .github/ci -p 'test_*.py' -v
      - id: target
        run: python .github/ci/release.py target
      - name: Install Lua static analysis
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1 luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1
      - name: Check selected addon
        env:
          ADDON: ${{ steps.target.outputs.addon }}
        run: |
          python .github/ci/security.py "$ADDON"
          python .github/ci/addons.py audit "$ADDON"
          python .github/ci/addons.py test "$ADDON"
      - name: Audit release tooling
        run: python -m pip_audit --strict --progress-spinner off -r .github/ci/requirements.txt
      - name: Build reproducible release ZIP
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python .github/ci/release.py preview
          else
            python .github/ci/release.py prepare
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: bundle
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to CurseForge and GitHub
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r .github/ci/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
          merge-multiple: true
      - name: Upload selected addon
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSE_FORGE_DEPLOYMENT_TOKEN: ${{ secrets.CURSE_FORGE_DEPLOYMENT_TOKEN }}
        run: python .github/ci/release.py publish
