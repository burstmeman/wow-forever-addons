# Shared Lua style for every addon. CI passes this file with --config-path.
# An addon stylua.toml, .styluaignore, or .editorconfig cannot replace it.
syntax = "Lua51"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Always"
space_after_function_names = "Never"
block_newline_gaps = "Never"
